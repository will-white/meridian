packages:
  - "apps/*"
  - "packages/*"

# Each override closes a published advisory that the parent's own range cannot reach, or raises a
# floor inside the parent's range so that no re-resolution of the lockfile can fall back to a
# vulnerable release (docs/phase-1-plan.md, decision 119). Remove an entry once every parent
# that pulls the package declares a fixed range itself; `pnpm audit` then still passes.
#
# (drizzle-orm 0.38 declared react and @types/react as optional peers and needed two "-" overrides
# to keep the web app's React out of the API and worker images, decision 102; drizzle-orm 0.45
# declares neither, so those overrides are gone and apps/api/src/deployStack.test.ts still checks.)
overrides:
  # fastify > @fastify/ajv-compiler (^4.0.0) and its ajv (^3.0.1): scheme spoofing, host confusion,
  # path equivalence and scheme injection (GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr,
  # GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp), fixed in 3.1.9 and 4.2.3; ships in the API image.
  "fast-uri@^3": "^3.1.9"
  "fast-uri@^4": "^4.2.3"
  # vite-plugin-pwa > workbox-build asks for glob ^11.0.1; the AbortSignal cancellation bypass
  # (GHSA-3g3m-2fjr-6pw4) is fixed only in 14.0.2. Build time only; workbox calls globSync with
  # cwd, follow and ignore, which glob 14 keeps (the API's @fastify/static 10 asks for ^14 itself).
  "workbox-build>glob": "^14.0.2"
  # typescript-eslint > typescript-estree asks for minimatch ^10.2.2; the globparts amplification
  # denial of service (GHSA-g3hv-75wg-m249) is fixed only in 11.0.1. Lint only; typescript-estree
  # calls minimatch(path, pattern, { dot: true }), unchanged in 11.
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
  # workbox-build > @rollup/plugin-terser asks for serialize-javascript ^7.0.3; the </script>
  # cross-site scripting (GHSA-m5mm-p8h7-m29v) is fixed in 7.1.3. Build time only.
  "serialize-javascript@^7": "^7.1.3"
  # drizzle-kit 0.31 still declares @esbuild-kit/esm-loader (deprecated, with esbuild ~0.18.20:
  # GHSA-67mh-4wv8-2f99, fixed in esbuild 0.25) but never loads it: it bundles tsx and uses its own
  # esbuild ^0.25. "-" removes the unused dependency (pnpm --filter @meridian/db generate is checked).
  "drizzle-kit>@esbuild-kit/esm-loader": "-"
