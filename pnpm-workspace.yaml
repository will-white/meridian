packages:
  - "apps/*"
  - "packages/*"

# Two kinds of override (docs/phase-1-plan.md).
#
# Advisories (decision 119): every dependency range in the graph that admits a release an advisory
# names is held above it. Where the parent's range cannot reach the fixed release, an override
# scoped to that parent goes past it; where the range admits the fix but also vulnerable releases,
# a floor (`name@range`) raises it to the fix, so that no re-resolution (an update, a parent
# upgraded, a merge that brings an older lockfile's resolution back) can pick a vulnerable one.
# The workspace's own manifests ask for fixed releases themselves. apps/api/src/
# dependencyFloors.test.ts checks the rule against every range the lockfile's packages declare.
# Remove an entry once every parent that pulls the package declares a fixed range itself.
#
# What the images hold (decision 102): pnpm fills an optional peer with any copy of that package
# the lockfile has, so a "-" override keeps a filled optional peer of drizzle-orm out of the API
# and worker images (drizzle-orm 0.38's react and @types/react took the web app's React; 0.45
# declares neither, so those two went with decision 119). apps/api/src/deployStack.test.ts fails
# when a production install holds a package that is there only to fill a peer.
overrides:
  # fastify > @fastify/ajv-compiler (^4.0.0), fastify > fast-json-stringify (^4.0.0) and
  # @fastify/ajv-compiler > ajv (^3.0.1): scheme spoofing, host confusion, path equivalence and
  # scheme injection (GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h,
  # GHSA-333x-w4r6-6crp), fixed in 3.1.9 and 4.2.3. Floors; ships in the API image.
  "fast-uri@^3": "^3.1.9"
  "fast-uri@^4": "^4.2.3"
  # @fastify/static 10 asks for glob ^14.0.0; the AbortSignal cancellation bypass
  # (GHSA-3g3m-2fjr-6pw4, >=9.0.0 <=14.0.1) is fixed in 14.0.2. Floor; ships in the API image.
  "glob@^14": "^14.0.2"
  # vite-plugin-pwa > workbox-build asks for glob ^11.0.1, which the same advisory covers and
  # which never reaches 14.0.2. Build time only; workbox calls globSync with cwd, follow and
  # ignore, which glob 14 keeps.
  "workbox-build>glob": "^14.0.2"
  # typescript-eslint > typescript-estree asks for minimatch ^10.2.2; the globparts amplification
  # denial of service (GHSA-g3hv-75wg-m249) is fixed only in 11.0.1. Lint only; typescript-estree
  # calls minimatch(path, pattern, { dot: true }), unchanged in 11.
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
  # workbox-build > @rollup/plugin-terser asks for serialize-javascript ^7.0.3; the </script>
  # cross-site scripting (GHSA-m5mm-p8h7-m29v) is fixed in 7.1.3. Floor; build time only.
  "serialize-javascript@^7": "^7.1.3"
  # drizzle-kit 0.31 still declares @esbuild-kit/esm-loader (deprecated, with esbuild ~0.18.20:
  # GHSA-67mh-4wv8-2f99, fixed in esbuild 0.25) but never loads it: it bundles tsx and uses its own
  # esbuild ^0.25. "-" removes the unused dependency (pnpm --filter @meridian/db generate is checked).
  "drizzle-kit>@esbuild-kit/esm-loader": "-"
  # drizzle-orm 0.45 declares gel (the Gel driver) among its optional peers. drizzle-kit 0.30
  # depended on gel 2.2.1, and when the kit moved to 0.31, which does not, pnpm kept that copy to
  # fill the peer: gel's CLI and 8 packages under it were in the API and worker images. The app
  # uses postgres-js only; "-" leaves the peer unfilled (decision 102).
  "drizzle-orm>gel": "-"
