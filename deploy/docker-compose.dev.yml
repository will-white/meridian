# Development only: publishes the database on the host's loopback for `pnpm dev`, `pnpm db:migrate`
# and the integration tests. Never use it on the home server, where only Caddy publishes ports.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d db
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
