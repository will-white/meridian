# Optional: read SECRETS_KEY (web, worker) and TIINGO_API_KEY (worker) from Docker secret files
# instead of .env, so they are not in any container's environment (docker inspect). Put each
# value alone in its file, readable by uid 1000 (the containers' `node` user):
#
#   mkdir -p deploy/secrets && openssl rand -base64 32 > deploy/secrets/secrets_key
#   touch deploy/secrets/tiingo_api_key     # the key, or empty with PRICE_PROVIDER=none
#   sudo chown 1000 deploy/secrets/* && chmod 400 deploy/secrets/*
#
# then leave SECRETS_KEY and TIINGO_API_KEY empty in .env and name both files on every command:
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.secrets.yml up -d --build
#
# (or export COMPOSE_FILE=deploy/docker-compose.yml:deploy/docker-compose.secrets.yml once).
# deploy/secrets/ is git-ignored.
services:
  web:
    secrets:
      - secrets_key
    environment:
      - SECRETS_KEY_FILE=/run/secrets/secrets_key
  worker:
    secrets:
      - secrets_key
      - tiingo_api_key
    environment:
      - SECRETS_KEY_FILE=/run/secrets/secrets_key
      - TIINGO_API_KEY_FILE=/run/secrets/tiingo_api_key

secrets:
  secrets_key:
    file: ./secrets/secrets_key
  tiingo_api_key:
    file: ./secrets/tiingo_api_key
