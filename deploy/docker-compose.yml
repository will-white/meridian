name: meridian

# Four services from the spec (web = API + static UI, worker, db, proxy) plus the nightly backup
# sidecar, defined in services.yml. This file only includes it, so that the ${...} values there
# are read from the repository's .env (../.env), whichever directory compose is run from:
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Needs Docker Compose 2.20 or later (`include` with `env_file`). A value set in the shell that
# runs compose wins over .env. Development adds docker-compose.dev.yml (the database on
# 127.0.0.1:5432); docker-compose.secrets.yml reads SECRETS_KEY and TIINGO_API_KEY from Docker
# secret files instead of .env.
include:
  - path: ./services.yml
    env_file: ../.env
